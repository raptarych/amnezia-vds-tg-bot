[project]
name = "amnezia-vds-bot"
version = "1.0.0"
description = "Telegram bot for managing Amnezia VPN through the HTTP API"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.7,<4",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "attrs>=23,<25",
    "prettytable>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "client"]

[tool.ruff]
line-length = 88
target-version = "py310"
